[project]
name = "slothshot"
version = "1.0.0"
description = "A sloth that tidies your screenshots overnight: a local 1B model inside a durable Temporal workflow."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pillow>=10.1",
    "rapidocr-onnxruntime>=1.4.4",
    "temporalio>=1.34.0",
    "uvicorn>=0.30",
]

[project.scripts]
slothshot = "slothshot.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slothshot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
