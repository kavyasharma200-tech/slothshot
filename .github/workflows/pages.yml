# Publishes the story page (src/slothshot/web) to GitHub Pages. The public copy replays the recorded night;
# the live parts only appear when the page is served by your own `slothshot up`.
name: story page
on:
  push:
    branches: [main]
    paths: ["src/slothshot/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: src/slothshot/web }
      - id: deploy
        uses: actions/deploy-pages@v4
